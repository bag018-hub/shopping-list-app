<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 리스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      color: #2d3436;
    }
    .app {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      overflow: hidden;
    }
    header {
      padding: 24px 24px 16px;
    }
    h1 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .count {
      font-size: 0.85rem;
      color: #636e72;
      margin-top: 4px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      padding: 0 24px 16px;
    }
    #itemInput {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #dfe6e9;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    #itemInput:focus { border-color: #667eea; }
    .add-btn {
      padding: 0 20px;
      border: none;
      border-radius: 10px;
      background: #667eea;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .add-btn:hover { background: #5568d3; }
    .add-btn:disabled { background: #b2bec3; cursor: default; }
    ul {
      list-style: none;
      padding: 0 24px 24px;
    }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: #f5f6fa;
      transition: background 0.15s;
    }
    li:hover { background: #eef0f6; }
    li.checked .item-text {
      text-decoration: line-through;
      color: #b2bec3;
    }
    .checkbox {
      width: 22px;
      height: 22px;
      cursor: pointer;
      accent-color: #667eea;
      flex-shrink: 0;
    }
    .item-text {
      flex: 1;
      font-size: 1rem;
      word-break: break-all;
    }
    .delete-btn {
      border: none;
      background: transparent;
      color: #ff7675;
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .delete-btn:hover { background: #ffe0e0; }
    .empty {
      text-align: center;
      color: #b2bec3;
      padding: 24px;
      font-size: 0.95rem;
    }
    .status {
      text-align: center;
      color: #ff7675;
      padding: 0 24px 16px;
      font-size: 0.85rem;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🛒 쇼핑 리스트</h1>
      <div class="count" id="count"></div>
    </header>
    <div class="input-row">
      <input type="text" id="itemInput" placeholder="살 물건을 입력하세요" autocomplete="off">
      <button class="add-btn" id="addBtn">추가</button>
    </div>
    <div class="status" id="status"></div>
    <ul id="list"></ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase 연동 설정
    const SUPABASE_URL = 'https://pdlaaofjbpwugyxumtji.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_W5aRW33ufbNzBSZY8fb61w_SUDPX9T5';
    const TABLE = 'shopping_items';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const listEl = document.getElementById('list');
    const inputEl = document.getElementById('itemInput');
    const addBtn = document.getElementById('addBtn');
    const countEl = document.getElementById('count');
    const statusEl = document.getElementById('status');

    let items = [];

    function setStatus(msg) {
      statusEl.textContent = msg || '';
    }

    // 데이터베이스에서 전체 목록을 불러온다
    async function load() {
      setStatus('불러오는 중…');
      const { data, error } = await db
        .from(TABLE)
        .select('*')
        .order('created_at', { ascending: true });
      if (error) {
        setStatus('불러오기 실패: ' + error.message);
        return;
      }
      items = data || [];
      setStatus('');
      render();
    }

    // 항목 추가 → DB에 저장
    async function addItem() {
      const text = inputEl.value.trim();
      if (!text) return;
      addBtn.disabled = true;
      const { data, error } = await db
        .from(TABLE)
        .insert({ text, checked: false })
        .select()
        .single();
      addBtn.disabled = false;
      if (error) {
        setStatus('추가 실패: ' + error.message);
        return;
      }
      items.push(data);
      inputEl.value = '';
      inputEl.focus();
      render();
    }

    // 체크 상태 토글 → DB 업데이트
    async function toggleItem(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      const newChecked = !item.checked;
      item.checked = newChecked; // 낙관적 업데이트
      render();
      const { error } = await db
        .from(TABLE)
        .update({ checked: newChecked })
        .eq('id', id);
      if (error) {
        item.checked = !newChecked; // 롤백
        setStatus('업데이트 실패: ' + error.message);
        render();
      }
    }

    // 항목 삭제 → DB에서 삭제
    async function deleteItem(id) {
      const prev = items;
      items = items.filter(i => i.id !== id); // 낙관적 업데이트
      render();
      const { error } = await db
        .from(TABLE)
        .delete()
        .eq('id', id);
      if (error) {
        items = prev; // 롤백
        setStatus('삭제 실패: ' + error.message);
        render();
      }
    }

    function render() {
      listEl.innerHTML = '';

      if (items.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = '아직 항목이 없습니다. 위에서 추가해 보세요!';
        listEl.appendChild(empty);
      } else {
        items.forEach(item => {
          const li = document.createElement('li');
          if (item.checked) li.classList.add('checked');

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.className = 'checkbox';
          checkbox.checked = item.checked;
          checkbox.addEventListener('change', () => toggleItem(item.id));

          const span = document.createElement('span');
          span.className = 'item-text';
          span.textContent = item.text;

          const del = document.createElement('button');
          del.className = 'delete-btn';
          del.innerHTML = '&times;';
          del.title = '삭제';
          del.addEventListener('click', () => deleteItem(item.id));

          li.append(checkbox, span, del);
          listEl.appendChild(li);
        });
      }

      const checkedCount = items.filter(i => i.checked).length;
      countEl.textContent = `전체 ${items.length}개 · 완료 ${checkedCount}개`;
    }

    addBtn.addEventListener('click', addItem);
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });

    load();
  </script>
</body>
</html>
